    <script>
      // Gracefully ignore Vite HMR WebSocket connection errors (HMR is disabled in AI Studio)
      (function() {
        const origErr = console.error;
        const origWarn = console.warn;
        console.error = function(...args) {
          const msg = args[0] ? String(args[0]) : '';
          if (msg.includes('send was called before connect') || msg.includes('[vite] connecting...') || msg.includes('WebSocket')) {
            return;
          }
          origErr.apply(console, args);
        };
        console.warn = function(...args) {
          const msg = args[0] ? String(args[0]) : '';
          if (msg.includes('send was called before connect') || msg.includes('[vite]') || msg.includes('WebSocket')) {
            return;
          }
          origWarn.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          const msg = e.message ? String(e.message) : '';
          if (msg.includes('send was called before connect') || msg.includes('WebSocket')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason ? String(e.reason) : '';
          if (reason.includes('send was called before connect') || reason.includes('WebSocket')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
